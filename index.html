 ck(S.tx.every(t=>t.type!=='reversal'||(S.tx.find(x=>x.id===t.rev)||{}).status==='reversed'),'Every reversal links to a reversed entry');
 ck(S.tx.every(t=>t.led.every(l=>S.accounts.some(a=>a.id===l[0]))),'No ledger line points to a missing account');
  ck(sum(S.accounts,rawBal)===sum(S.accounts,a=>a.open)+sum(S.tx,t=>sum(t.led,l=>l[1])),'Account balances equal openings plus ledger');
